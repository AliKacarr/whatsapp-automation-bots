<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Anket & Analytics Dashboard</title>

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(21, 29, 48, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-emerald: #10b981;
      --accent-emerald-glow: rgba(16, 185, 129, 0.25);
      --accent-cyan: #06b6d4;
      --accent-purple: #8b5cf6;
      --accent-rose: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-sub: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      background-image:
        radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.04) 0%, transparent 60%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    h1,
    h2,
    h3,
    h4,
    .brand-font {
      font-family: 'Outfit', sans-serif;
    }

    .container {
      width: 100%;
      max-width: 620px;
    }

    /* Glassmorphism App Header */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header-logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .header-logo-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent-emerald), var(--accent-cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 8px 24px var(--accent-emerald-glow);
    }

    .header-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 30%, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* Main Dashboard Card */
    .main-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .main-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-emerald), var(--accent-cyan), transparent);
    }

    /* Target Group Banner */
    .group-banner {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 12px;
    }

    .group-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }

    .group-icon {
      font-size: 18px;
    }

    .group-name {
      font-weight: 600;
      color: var(--text-main);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2px;
      transition: all 0.3s ease;
    }

    .badge-ready {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.3);
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.2);
    }

    .badge-waiting {
      background: rgba(6, 182, 212, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .badge-initializing {
      background: rgba(139, 92, 246, 0.15);
      color: #a78bfa;
      border: 1px solid rgba(167, 139, 250, 0.3);
    }

    .badge-error {
      background: rgba(244, 63, 94, 0.15);
      color: #fb7185;
      border: 1px solid rgba(251, 113, 133, 0.3);
    }

    /* Content Area */
    .content-area {
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px 0;
    }

    /* QR Code Display Box */
    .qr-container {
      background: #ffffff;
      padding: 16px;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      display: inline-block;
      margin: 16px 0;
      transition: transform 0.3s ease;
    }

    .qr-container:hover {
      transform: scale(1.02);
    }

    .qr-container img {
      width: 210px;
      height: 210px;
      display: block;
    }

    /* Pairing Code Box */
    .pairing-box {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 16px;
      margin-top: 14px;
    }

    .phone-input-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .phone-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .phone-input:focus {
      border-color: var(--accent-cyan);
    }

    .pairing-code-display {
      font-family: 'Outfit', monospace;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #38bdf8;
      background: rgba(6, 182, 212, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 12px 20px;
      border-radius: 12px;
      margin-top: 12px;
      display: inline-block;
    }

    /* Buttons & Actions */
    .actions-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-emerald), #059669);
      color: #ffffff;
      box-shadow: 0 4px 20px var(--accent-emerald-glow);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(16, 185, 129, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    .btn-info {
      background: linear-gradient(135deg, var(--accent-cyan), #0284c7);
      color: #ffffff;
    }

    .btn-info:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.35);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    /* Last Sent Timestamp */
    .last-sent-info {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-card {
      width: 100%;
      max-width: 480px;
      background: #111827;
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .group-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .group-item-name {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
    }

    .group-item-id {
      font-size: 11px;
      color: var(--text-sub);
      font-family: monospace;
    }

    .copy-btn {
      padding: 6px 12px;
      font-size: 11px;
      border-radius: 8px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.3);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .copy-btn:hover {
      background: rgba(16, 185, 129, 0.3);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e293b;
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 1000;
      animation: fadeIn 0.3s ease;
    }

    /* Loading Spinner */
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent-emerald);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 16px auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-logo">
        <div class="header-logo-icon">📊</div>
        <h1 class="header-title">WhatsApp Analytics & Bot</h1>
      </div>
      <p class="header-subtitle">Otomatik Günlük Anket & Anlık Oy Takip Paneli</p>
    </div>

    <!-- Main Card -->
    <div class="main-card">
      <!-- Target Group Banner -->
      <div class="group-banner">
        <div class="group-info">
          <span class="group-icon">👥</span>
          <div>
            <div style="font-size: 11px; color: var(--text-sub); font-weight: 500;">HEDEF GRUP</div>
            <div class="group-name" id="targetGroupName">Yükleniyor...</div>
          </div>
        </div>
        <div class="badge badge-initializing" id="statusBadge">
          🚀 Kontrol Ediliyor...
        </div>
      </div>

      <!-- Dynamic Content Area -->
      <div class="content-area" id="contentArea">
        <div class="spinner"></div>
        <p style="font-size: 13px; color: var(--text-muted);">Bağlantı durumu sorgulanıyor...</p>
      </div>

      <!-- Action Buttons -->
      <div class="actions-grid">
        <button class="btn btn-primary" id="sendPollBtn" onclick="sendPoll()" disabled>
          Anketi Şimdi Gönder
        </button>
        <div class="btn-row">
          <button class="btn btn-secondary" id="showGroupsBtn" onclick="showGroups()" disabled>
            Gruplar & JID
          </button>
          <button class="btn btn-secondary" id="restartBtn" onclick="triggerRestart(true)">
            Yeniden Bağlan / QR
          </button>
        </div>
      </div>

      <!-- Last Sent Timestamp -->
      <div class="last-sent-info" id="lastSentRow" style="display: none;">
        <span>Son Anket Gönderim Zamanı:</span>
        <strong id="lastSentTime" style="color: var(--text-main);">-</strong>
      </div>
    </div>
  </div>

  <!-- Groups & JID List Modal -->
  <div class="modal-overlay" id="groupsModal">
    <div class="modal-card">
      <h3 style="font-size: 18px; color: #fff; margin-bottom: 6px;">📋 WhatsApp Gruplarınız</h3>
      <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 16px;">
        <code>.env</code> dosyanızdaki <b>WHATSAPP_GROUP_ID</b> için ilgili grubun JID kodunu kopyalayın.
      </p>
      <div id="groupsListArea" style="max-height: 280px; overflow-y: auto; padding-right: 4px;"></div>
      <button class="btn btn-secondary" style="margin-top: 16px;" onclick="closeGroupsModal()">Kapat</button>
    </div>
  </div>

  <!-- Toast Message -->
  <div class="toast" id="toastMsg"></div>

  <script>
    let lastRenderedStatus = '';
    let currentQrDataUrl = '';

    async function checkStatus() {
      try {
        const res = await fetch('/api/status?autoStart=true');
        const data = await res.json();
        renderState(data);
      } catch (err) {
        console.error('Status fetch error:', err);
      }
    }

    function renderState(data) {
      const badge = document.getElementById('statusBadge');
      const content = document.getElementById('contentArea');
      const sendBtn = document.getElementById('sendPollBtn');
      const showGroupsBtn = document.getElementById('showGroupsBtn');
      const lastSentRow = document.getElementById('lastSentRow');
      const lastSentTime = document.getElementById('lastSentTime');
      const targetGroupEl = document.getElementById('targetGroupName');

      // Target Group Header
      if (targetGroupEl) {
        if (data.targetGroup?.name) {
          targetGroupEl.innerHTML = `<b>${data.targetGroup.name}</b>`;
        } else if (data.targetGroup?.id) {
          targetGroupEl.innerHTML = `<span style="font-size:12px; opacity:0.8;">${data.targetGroup.id}</span>`;
        } else {
          targetGroupEl.innerText = '.env WHATSAPP_GROUP_ID tanımlanmadı';
        }
      }

      // Last Poll Sent Time
      if (data.lastPollSentAt) {
        lastSentRow.style.display = 'flex';
        lastSentTime.innerText = new Date(data.lastPollSentAt).toLocaleString('tr-TR');
      }

      // Status: MISSING_GROUP_ID
      if (data.status === 'MISSING_GROUP_ID') {
        badge.className = 'badge badge-error';
        badge.innerHTML = '⚠️ WHATSAPP_GROUP_ID Eksik';
        sendBtn.disabled = true;
        if (showGroupsBtn) showGroupsBtn.disabled = true;

        if (lastRenderedStatus !== 'MISSING_GROUP_ID') {
          content.innerHTML = `
            <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(248, 113, 113, 0.25); border-radius: 18px; padding: 22px; width: 100%;">
              <div style="font-size: 38px; margin-bottom: 10px;">🛑</div>
              <h3 style="font-size: 17px; color: #f87171; margin-bottom: 8px;">WHATSAPP_GROUP_ID Eksik</h3>
              <p style="font-size: 13px; color: var(--text-muted); line-height: 1.6;">
                WhatsApp QR kodunu üretebilmek veya oturum açabilmek için öncelikle <code>.env</code> dosyanıza geçerli bir <b>WHATSAPP_GROUP_ID</b> eklemelisiniz.
              </p>
            </div>
          `;
          lastRenderedStatus = 'MISSING_GROUP_ID';
        }
      }
      // Status: READY
      else if (data.status === 'READY') {
        badge.className = 'badge badge-ready';
        badge.innerHTML = '✅ WhatsApp Bağlı';
        sendBtn.disabled = false;
        if (showGroupsBtn) showGroupsBtn.disabled = false;

        if (lastRenderedStatus !== 'READY') {
          content.innerHTML = `
            <div style="padding: 12px 0;">
              <div style="font-size: 48px; margin-bottom: 8px;">✨</div>
              <h3 style="font-size: 20px; font-weight: 700;">Bağlantı Aktif</h3>
              <p style="color: var(--text-muted); font-size: 14px; margin-top: 6px;">
                ${data.userInfo?.pushname ? 'Bağlı Kullanıcı: <b>' + data.userInfo.pushname + '</b>' : 'WhatsApp istemcisi hazır'}
              </p>
            </div>
          `;
          lastRenderedStatus = 'READY';
        }
      }
      // Status: WAITING_FOR_QR
      else if (data.status === 'WAITING_FOR_QR' && data.qrDataUrl) {
        badge.className = 'badge badge-waiting';
        badge.innerHTML = '📲 Giriş Bekleniyor';
        sendBtn.disabled = true;
        if (showGroupsBtn) showGroupsBtn.disabled = true;

        if (lastRenderedStatus !== 'WAITING_FOR_QR') {
          content.innerHTML = `
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">
              <b>Yöntem 1:</b> WhatsApp -> <b>Bağlı Cihazlar</b> -> QR Kodu Okutun:
            </p>
            <div class="qr-container">
              <img id="qrImg" src="${data.qrDataUrl}" alt="WhatsApp QR Code" />
            </div>

            <div class="pairing-box">
              <p style="font-size: 12px; font-weight: 600; color: #fff;">Yöntem 2: Telefon Numarası İle (QR'sız 8-Haneli Kod)</p>
              <div class="phone-input-group">
                <input type="text" id="phoneNumInput" class="phone-input" placeholder="5551234567" />
                <button class="btn btn-info" style="width: auto; padding: 0 16px;" onclick="getPairingCode()">Kod Al</button>
              </div>
              <div id="pairingCodeResult" style="display:none;"></div>
            </div>
          `;
          lastRenderedStatus = 'WAITING_FOR_QR';
          currentQrDataUrl = data.qrDataUrl;
        } else if (currentQrDataUrl !== data.qrDataUrl) {
          const qrImg = document.getElementById('qrImg');
          if (qrImg) qrImg.src = data.qrDataUrl;
          currentQrDataUrl = data.qrDataUrl;
        }
      }
      // Status: INITIALIZING
      else if (data.status === 'INITIALIZING') {
        badge.className = 'badge badge-initializing';
        badge.innerHTML = '🚀 Başlatılıyor...';
        sendBtn.disabled = true;
        if (showGroupsBtn) showGroupsBtn.disabled = true;

        if (lastRenderedStatus !== 'INITIALIZING') {
          content.innerHTML = `
            <div class="spinner"></div>
            <p style="font-size: 13px; color: var(--text-muted); margin-top: 8px;">WhatsApp istemcisi hazırlanıyor...</p>
          `;
          lastRenderedStatus = 'INITIALIZING';
        }
      }
      // Status: DISCONNECTED / ERROR
      else {
        badge.className = 'badge badge-error';
        badge.innerHTML = '⚠️ Oturum Kapalı';
        sendBtn.disabled = true;
        if (showGroupsBtn) showGroupsBtn.disabled = true;

        const errorKey = 'ERROR_' + (data.lastError || '');
        if (lastRenderedStatus !== errorKey) {
          content.innerHTML = `
            <p style="font-size: 14px; color: var(--text-muted); margin: 16px 0;">
              ${data.lastError ? 'Hata: ' + data.lastError : 'Oturum kapalı. Yeniden başlatarak bağlanabilirsiniz.'}
            </p>
            <button class="btn btn-info" style="margin-top: 8px; width: auto;" onclick="triggerRestart(true)">
              📲 QR Kod Üret / Bağlan
            </button>
          `;
          lastRenderedStatus = errorKey;
        }
      }
    }

    async function sendPoll() {
      const sendBtn = document.getElementById('sendPollBtn');
      sendBtn.disabled = true;
      sendBtn.innerText = '⏳ Gönderiliyor...';

      try {
        const res = await fetch('/api/send-poll', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          showToast('✅ Anket başarıyla gruba gönderildi!');
        } else {
          showToast('❌ Hata: ' + (data.message || 'Gönderilemedi'));
        }
      } catch (err) {
        showToast('❌ Sunucu hatası oluştu');
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerText = '🗳️ Anketi Şimdi Gönder';
        checkStatus();
      }
    }

    async function showGroups() {
      const modal = document.getElementById('groupsModal');
      const listArea = document.getElementById('groupsListArea');
      listArea.innerHTML = '<div class="spinner"></div><p style="font-size:12px; color:var(--text-muted); text-align:center;">Gruplar çekiliyor...</p>';
      modal.style.display = 'flex';

      try {
        const res = await fetch('/api/groups');
        const data = await res.json();

        if (data.success && data.groups && data.groups.length > 0) {
          listArea.innerHTML = data.groups.map(g => `
            <div class="group-item">
              <div style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                <div class="group-item-name">${escapeHtml(g.name)}</div>
                <div class="group-item-id">${g.id}</div>
              </div>
              <button class="copy-btn" onclick="copyText('${g.id}')">Kopyala</button>
            </div>
          `).join('');
        } else {
          listArea.innerHTML = '<p style="font-size: 13px; color: var(--text-muted); text-align:center; padding: 20px 0;">Grup bulunamadı veya henüz katıldığınız grup yok.</p>';
        }
      } catch (err) {
        listArea.innerHTML = '<p style="font-size: 13px; color: var(--accent-rose); text-align:center;">Gruplar alınırken hata oluştu.</p>';
      }
    }

    function closeGroupsModal() {
      document.getElementById('groupsModal').style.display = 'none';
    }

    async function getPairingCode() {
      const input = document.getElementById('phoneNumInput');
      const resultDiv = document.getElementById('pairingCodeResult');
      const phone = input?.value?.trim();

      if (!phone) {
        showToast('⚠️ Lütfen telefon numaranızı girin');
        return;
      }

      resultDiv.style.display = 'block';
      resultDiv.innerHTML = '<div class="spinner" style="width:24px; height:24px; border-width:2px;"></div>';

      try {
        const res = await fetch('/api/request-pairing-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phoneNumber: phone })
        });
        const data = await res.json();

        if (data.success && data.code) {
          resultDiv.innerHTML = `
            <p style="font-size:12px; color:var(--text-muted); margin-top:8px;">WhatsApp'a girilecek 8-haneli kodunuz:</p>
            <div class="pairing-code-display">${data.code}</div>
          `;
        } else {
          resultDiv.innerHTML = `<p style="font-size:12px; color:var(--accent-rose); margin-top:8px;">Hata: ${data.message || 'Kod alınamadı'}</p>`;
        }
      } catch (e) {
        resultDiv.innerHTML = '<p style="font-size:12px; color:var(--accent-rose); margin-top:8px;">Bağlantı hatası</p>';
      }
    }

    async function triggerRestart(forceNew = false) {
      lastRenderedStatus = '';
      const content = document.getElementById('contentArea');
      content.innerHTML = '<div class="spinner"></div><p style="font-size: 13px; color: var(--text-muted);">Yeniden başlatılıyor...</p>';

      try {
        await fetch('/api/restart', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ forceNewQR: forceNew })
        });
        showToast('🔄 Oturum sıfırlandı, yeniden başlatılıyor...');
      } catch (e) { }

      setTimeout(checkStatus, 2000);
    }

    function copyText(text) {
      navigator.clipboard.writeText(text);
      showToast('📋 JID kopyalandı: ' + text);
    }

    function showToast(msg) {
      const toast = document.getElementById('toastMsg');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Polling every 3 seconds
    setInterval(checkStatus, 3000);
    checkStatus();
  </script>
</body>

</html>
